<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 590" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- 제목 -->
  <text x="200" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#333">Post-LN (원래 Transformer)</text>
  <text x="200" y="572" text-anchor="middle" font-size="13" fill="#555">x ← LN(x + Sublayer(x))</text>
  <text x="560" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#333">Pre-LN (ViT)</text>
  <text x="560" y="572" text-anchor="middle" font-size="13" fill="#555">x ← x + Sublayer(LN(x))</text>
  <line x1="380" y1="20" x2="380" y2="580" stroke="#bbb" stroke-dasharray="6 6"/>

  <!-- ===== Post-LN (가운데 x=200) ===== -->
  <text x="200" y="530" text-anchor="middle" font-size="14" fill="#333">입력 x (n, d)</text>
  <line x1="200" y1="512" x2="200" y2="462" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="110" y="420" width="180" height="40" rx="8" fill="#F58518" fill-opacity="0.18" stroke="#F58518" stroke-width="2"/>
  <text x="200" y="445" text-anchor="middle" font-size="15" fill="#333">Multi-Head Attention</text>
  <line x1="200" y1="420" x2="200" y2="398" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <circle cx="200" cy="385" r="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="200" y="391" text-anchor="middle" font-size="18" fill="#333">+</text>
  <polyline points="200,490 320,490 320,385 214,385" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="200" y1="373" x2="200" y2="352" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="110" y="310" width="180" height="40" rx="8" fill="#EECA3B" fill-opacity="0.3" stroke="#B8961A" stroke-width="2"/>
  <text x="200" y="335" text-anchor="middle" font-size="15" fill="#333">LayerNorm</text>
  <line x1="200" y1="310" x2="200" y2="272" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="110" y="230" width="180" height="40" rx="8" fill="#4C78A8" fill-opacity="0.18" stroke="#4C78A8" stroke-width="2"/>
  <text x="200" y="255" text-anchor="middle" font-size="15" fill="#333">FFN (ReLU)</text>
  <line x1="200" y1="230" x2="200" y2="208" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <circle cx="200" cy="195" r="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="200" y="201" text-anchor="middle" font-size="18" fill="#333">+</text>
  <polyline points="200,290 320,290 320,195 214,195" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="200" y1="183" x2="200" y2="162" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="110" y="120" width="180" height="40" rx="8" fill="#EECA3B" fill-opacity="0.3" stroke="#B8961A" stroke-width="2"/>
  <text x="200" y="145" text-anchor="middle" font-size="15" fill="#333">LayerNorm</text>
  <line x1="200" y1="120" x2="200" y2="88" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="200" y="80" text-anchor="middle" font-size="14" fill="#333">출력 (다음 layer로)</text>
  <text x="40" y="470" font-size="12" fill="#E45756">residual 합 뒤에</text>
  <text x="40" y="486" font-size="12" fill="#E45756">LN이 온다</text>

  <!-- ===== Pre-LN (가운데 x=560) ===== -->
  <text x="560" y="530" text-anchor="middle" font-size="14" fill="#333">입력 z (N+1, D)</text>
  <line x1="560" y1="512" x2="560" y2="462" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="470" y="420" width="180" height="40" rx="8" fill="#EECA3B" fill-opacity="0.3" stroke="#B8961A" stroke-width="2"/>
  <text x="560" y="445" text-anchor="middle" font-size="15" fill="#333">LayerNorm</text>
  <line x1="560" y1="420" x2="560" y2="392" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="470" y="350" width="180" height="40" rx="8" fill="#F58518" fill-opacity="0.18" stroke="#F58518" stroke-width="2"/>
  <text x="560" y="375" text-anchor="middle" font-size="15" fill="#333">Multi-Head Attention</text>
  <line x1="560" y1="350" x2="560" y2="328" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <circle cx="560" cy="315" r="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="560" y="321" text-anchor="middle" font-size="18" fill="#333">+</text>
  <polyline points="560,490 690,490 690,315 574,315" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="560" y1="303" x2="560" y2="272" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="470" y="230" width="180" height="40" rx="8" fill="#EECA3B" fill-opacity="0.3" stroke="#B8961A" stroke-width="2"/>
  <text x="560" y="255" text-anchor="middle" font-size="15" fill="#333">LayerNorm</text>
  <line x1="560" y1="230" x2="560" y2="202" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="470" y="160" width="180" height="40" rx="8" fill="#4C78A8" fill-opacity="0.18" stroke="#4C78A8" stroke-width="2"/>
  <text x="560" y="185" text-anchor="middle" font-size="15" fill="#333">MLP (GELU)</text>
  <line x1="560" y1="160" x2="560" y2="138" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <circle cx="560" cy="125" r="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="560" y="131" text-anchor="middle" font-size="18" fill="#333">+</text>
  <polyline points="560,290 690,290 690,125 574,125" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="560" y1="113" x2="560" y2="88" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="560" y="80" text-anchor="middle" font-size="14" fill="#333">출력 (다음 layer로)</text>
  <text x="700" y="410" font-size="12" fill="#54A24B">입력이 LN을</text>
  <text x="700" y="426" font-size="12" fill="#54A24B">거치지 않고</text>
  <text x="700" y="442" font-size="12" fill="#54A24B">끝까지 흐른다</text>
</svg>
